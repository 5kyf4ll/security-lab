<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sentra LIVE</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header class="header">
        <h1>Sentra LIVE</h1>
    </header>

    <main class="main-layout">

        <!-- Reproductor -->
        <section class="player-section">
            <div class="player-wrapper">
                <div id="recIndicator" class="rec-indicator hidden">
                    <div class="rec-dot"></div>
                    <small>GRABANDO</small>
                </div>
                <div class="rotator" id="rotator">
                    <img src="/video_feed" class="live-player" id="livePlayer" alt="Streaming en vivo">
                </div>
            </div>
        </section>

        <!-- Herramientas -->
        <section class="toolbar">
            <button class="tool-btn" id="rotateCW"><span>⟳</span> Girar 90°</button>
            <button class="tool-btn" id="rotateCCW"><span>⟲</span> Girar -90°</button>
            <button class="tool-btn" id="captureBtn"><span>📸</span> Captura</button>
            <button class="tool-btn" id="recordBtn"><span>⏺</span> Grabar</button>
        </section>

        <!-- Configuración Snapshots -->
        <section class="snapshots-control">
            <label>
                <b>Capturas Automáticas:</b>
                Intervalo (s):
                <input type="number" id="intervalInput" min="1" value="5">
            </label>
            <button id="snapEnable" class="btn-action">Activar</button>
            <button id="snapDisable" class="btn-action">Desactivar</button>
            <span id="snapStatus">Estado: OFF</span>
        </section>

        <!-- Visor de Archivos -->
        <section class="viewer-section">
            <div class="viewer-switch">
                <button class="switch-btn active" data-mode="captures">Capturas</button>
                <button class="switch-btn" data-mode="videos">Videos</button>
            </div>
            <div class="viewer-grid" id="viewerGrid">
                <!-- Se llena con JS -->
            </div>
        </section>

    </main>
    <script src="/static/app.js"></script>
</body>
</html>
